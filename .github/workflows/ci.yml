# Laeuft bei jedem Push und jedem Pull Request.
# Zweck: nichts kommt in den Hauptzweig, das nicht formatiert, fehlerfrei
# typisiert und getestet ist. Das ersetzt "bei mir lief es".
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pruefen:
    name: Formatierung, Linter, Typen, Tests
    runs-on: ubuntu-latest

    # Eine echte Datenbank fuer die Tests. Wird ab Phase 1 gebraucht.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dels
          POSTGRES_PASSWORD: dels_ci_passwort
          POSTGRES_DB: dels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dels -d dels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://dels:dels_ci_passwort@localhost:5432/dels_test
      # Nur fuer die CI. Das echte Geheimnis liegt niemals im Repository.
      SESSION_SECRET: ci-geheimnis-nur-fuer-tests-mindestens-32-zeichen
      WEB_ORIGIN: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # "ci" statt "install": installiert exakt das, was in package-lock.json
      # steht, und bricht ab, wenn die Datei nicht dazu passt.
      - name: Abhaengigkeiten installieren
        run: npm ci

      # Muss vor allem anderen laufen: api und web importieren das
      # gebaute Ergebnis aus packages/shared/dist.
      - name: Gemeinsames Paket bauen
        run: npm run build -w @dels/shared

      - name: Formatierung pruefen
        run: npm run format:check

      - name: Linter
        run: npm run lint

      - name: Typen pruefen
        run: npm run typecheck

      # Die Datenbanktests pruefen echte Fremdschluessel und Pruefregeln,
      # dafuer muss das Schema in der Testdatenbank stehen.
      - name: Datenbank migrieren
        run: npm run db:migrate -w @dels/api

      - name: Tests
        run: npm test

      - name: Produktionsbau
        run: npm run build

  # ---------------------------------------------------------------------
  # Der Docker-Bau, und zwar nicht nur "baut durch", sondern gestartet und
  # angefasst.
  #
  # Warum das hier steht: der Bau war lange als "nicht ausprobiert"
  # gekennzeichnet, weil in der Umgebung, in der er entstand, kein
  # Docker-Daemon lief. Eine Anleitung, die niemand je ausgefuehrt hat,
  # ist eine Vermutung. Hier laeuft sie bei jedem Push.
  #
  # Der Rauchtest prueft genau die Dinge, die ein reiner Bau NICHT findet:
  # ob argon2 als native Bibliothek im Bild funktioniert, ob die
  # Migrationen beim Start durchlaufen, ob die gebaute Oberflaeche
  # tatsaechlich ausgeliefert wird.
  # ---------------------------------------------------------------------
  docker:
    name: Docker-Bau und Rauchtest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dels
          POSTGRES_PASSWORD: dels_ci_passwort
          POSTGRES_DB: dels_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dels -d dels_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Bild bauen
        run: docker build -t dels-stundentool:test .

      # --network host, damit der Container die Postgres-Dienstleistung
      # des Laufers unter localhost erreicht.
      - name: Container starten
        run: |
          docker run -d --name dels-test --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://dels:dels_ci_passwort@localhost:5432/dels_test \
            -e SESSION_SECRET=ci-geheimnis-nur-fuer-tests-mindestens-32-zeichen \
            -e WEB_ORIGIN=https://beispiel.invalid \
            dels-stundentool:test

      - name: Warten, bis die Anwendung gesund meldet
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:3000/api/health | grep -q '"datenbank":true'; then
              echo "Die Anwendung laeuft und erreicht die Datenbank."
              exit 0
            fi
            sleep 2
          done
          echo "Der Container wurde nicht gesund. Log:"
          docker logs dels-test
          exit 1

      # Im Produktionsbild liefert Express die gebaute Oberflaeche selbst
      # aus. Wenn der Bau die Oberflaeche vergisst, faellt es hier auf.
      - name: Oberflaeche wird ausgeliefert
        run: |
          code=$(curl -s -o /tmp/seite.html -w "%{http_code}" http://localhost:3000/)
          echo "GET / -> $code"
          test "$code" = "200"
          grep -qi "<div id=\"root\"" /tmp/seite.html

      - name: Tiefe Verknuepfung landet auch auf der Oberflaeche
        run: |
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/uebersicht)" = "200"

      - name: Unbekannte API-Route gibt 404, nicht die Oberflaeche
        run: |
          test "$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/gibtsnicht)" = "404"

      - name: Log zeigen, egal wie es ausging
        if: always()
        run: docker logs dels-test || true
